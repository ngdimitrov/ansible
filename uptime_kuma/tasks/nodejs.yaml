---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [uptime_kuma, install, nodejs]

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [uptime_kuma, install, nodejs]

- name: Install GPG and curl for keyring setup
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
      - ca-certificates
    state: present
  become: true
  tags: [uptime_kuma, install, nodejs]

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: "{{ nodejs_gpg_key_url }}"
    dest: /tmp/nodesource.gpg.key
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [uptime_kuma, install, nodejs]

- name: Dearmor NodeSource GPG key into apt keyring
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o {{ nodejs_keyring_path }} /tmp/nodesource.gpg.key
    creates: "{{ nodejs_keyring_path }}"
  become: true
  tags: [uptime_kuma, install, nodejs]

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ nodejs_keyring_path }}] https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true
  become: true
  tags: [uptime_kuma, install, nodejs]

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
  become: true
  tags: [uptime_kuma, install, nodejs]
