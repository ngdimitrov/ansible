---
- name: Create Promtail group
  ansible.builtin.group:
    name: "{{ promtail_group }}"
    system: true
    state: present
  become: true
  tags: [promtail, install]

- name: Create Promtail user
  ansible.builtin.user:
    name: "{{ promtail_user }}"
    group: "{{ promtail_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  become: true
  tags: [promtail, install]

- name: Allow promtail user to read system logs
  ansible.builtin.user:
    name: "{{ promtail_user }}"
    groups: adm
    append: true
  become: true
  tags: [promtail, install]
