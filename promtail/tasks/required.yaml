---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [promtail, install]

- name: Install unzip package
  ansible.builtin.apt:
    name: unzip
    state: present
  become: true
  tags: [promtail, install]

- name: Create Promtail directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ promtail_user }}"
    group: "{{ promtail_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ promtail_installation }}", mode: "0755" }
    - { path: "{{ promtail_config_path }}", mode: "0750" }
    - { path: "{{ promtail_positions_file | dirname }}", mode: "0750" }
  become: true
  tags: [promtail, install]
