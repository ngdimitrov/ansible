[defaults]
roles_path = ./:./ansible/monitoring/roles:./ansible/ansible_inuxtv/role/roles
collections_path = ./.ansible/collections:~/.ansible/collections
host_key_checking = False
nocows = True
stdout_callback = default
retry_files_enabled = False
deprecation_warnings = False
forks = 10
gather_subset = !hardware,!facter,!ohai
fact_caching = jsonfile
fact_caching_connection = /tmp/.ansible-facts
fact_caching_timeout = 7200
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
