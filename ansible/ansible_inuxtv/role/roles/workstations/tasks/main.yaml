---
- name: Install unzip.
  ansible.builtin.package:
    name: unzip
    state: present

- name: Install terraform.
  ansible.builtin.unarchive:
    src: https://releases.hashicorp.com/terraform/1.15.3/terraform_1.15.3_linux_amd64.zip
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    owner: root
    group: root
