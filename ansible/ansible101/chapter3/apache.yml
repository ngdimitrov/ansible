---
- name: Install Apache.
  hosts: centos
  become: true

  handlers:
    - name: Restart Apache.
      ansible.builtin.service:
        name: httpd
        state: restarted

  tasks:
    - name: Ensure Apache is installed.
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Copy test config file.
      ansible.builtin.copy:
        src: files/test.conf
        dest: /etc/httpd/conf.d/test.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart Apache.

    - name: Ensure Apache is running and starts at boot.
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
