---
- name: Validate target architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in loki_arch_map
    fail_msg: >-
      Unsupported architecture {{ ansible_facts['architecture'] }};
      add it to loki_arch_map.
    success_msg: "Architecture {{ ansible_facts['architecture'] }} maps to {{ loki_arch }}."
    quiet: true
  tags: [loki, always]

- name: Create Loki user and group
  ansible.builtin.import_tasks: prerequisites.yaml
  tags: [loki, install]

- name: Install required packages and directories
  ansible.builtin.import_tasks: required.yaml
  tags: [loki, install]

- name: Download Loki binary
  ansible.builtin.get_url:
    url: "{{ loki_binary_url }}"
    dest: "{{ loki_installation }}/{{ loki_binary_url | basename }}"
    mode: "0644"
    owner: root
    group: root
    checksum: "{{ ('sha256:' ~ loki_binary_sha256) if loki_binary_sha256 else omit }}"
  become: true
  tags: [loki, install]

- name: Unzip Loki binary
  ansible.builtin.unarchive:
    src: "{{ loki_installation }}/{{ loki_binary_url | basename }}"
    dest: "{{ loki_installation }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    creates: "{{ loki_installation }}/{{ loki_binary_name }}"
  become: true
  tags: [loki, install]

- name: Setup Loki config
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: "{{ loki_config_path }}/{{ loki_config_name }}"
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0640"
  become: true
  notify: Restart Loki
  tags: [loki, config]

- name: Setup Loki systemd unit
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    owner: root
    group: root
    mode: "0644"
    validate: "systemd-analyze verify %s"
  become: true
  notify: Restart Loki
  tags: [loki, config, systemd]

- name: Ensure Loki service is enabled and started
  ansible.builtin.systemd:
    name: loki
    enabled: true
    daemon_reload: true
    state: started
  become: true
  tags: [loki, service]
