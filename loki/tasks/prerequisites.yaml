---
- name: Create Loki group
  ansible.builtin.group:
    name: "{{ loki_group }}"
    system: true
    state: present
  become: true
  tags: [loki, install]

- name: Create Loki user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  become: true
  tags: [loki, install]
