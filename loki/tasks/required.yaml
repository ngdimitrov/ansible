---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [loki, install]

- name: Install unzip package
  ansible.builtin.apt:
    name: unzip
    state: present
  become: true
  tags: [loki, install]

- name: Create directories owned by Loki
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ loki_installation }}", mode: "0755" }
    - { path: "{{ loki_config_path }}", mode: "0750" }
    - { path: "{{ loki_data_dir }}", mode: "0750" }
    - { path: "{{ loki_log_dir }}", mode: "0750" }
  become: true
  tags: [loki, install]
